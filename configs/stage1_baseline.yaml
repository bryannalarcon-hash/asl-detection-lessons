# Baseline Stage 1 v1 config for the 49-keypoint whole-body heatmap net, trained on a 70/30 COCO-WholeBody + FreiHAND mix at 256px input / 64px heatmaps.
# Serves as the original from-scratch reference run (50 epochs, batch 128) against which later v2 and v3 variants are compared.
run_name: stage1_baseline

data:
  coco_root: data/coco
  coco_ann_file: data/coco/annotations/coco_wholebody_train_v1.0.json
  coco_val_ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
  freihand_root: data/FreiHAND_pub_v2
  image_size: 256
  heatmap_size: 64
  heatmap_sigma: 2.0
  sample_ratio_coco: 0.7
  sample_ratio_freihand: 0.3
  flip_prob: 0.5
  color_jitter: 0.2

model:
  num_keypoints: 49
  backbone_channels: [32, 64, 128, 256, 384]
  heatmap_channels: 256

train:
  batch_size: 128
  num_workers: 24
  epochs: 50
  lr: 1.0e-3
  lr_min: 1.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 15
  early_stop_min_delta: 0.001
  mixed_precision: true
  log_every: 50
  val_every: 1
  checkpoint_dir: checkpoints/stage1
  seed: 42
