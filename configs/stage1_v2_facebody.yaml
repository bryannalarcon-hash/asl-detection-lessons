run_name: stage1_v2_facebody

data:
  coco_root: data/coco
  coco_ann_file: data/coco/annotations/coco_wholebody_train_v1.0.json
  coco_val_ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
  coco_train_images: train2017
  coco_val_images: train2017
  freihand_root: data/FreiHAND_pub_v2
  image_size: 256
  heatmap_size: 64
  heatmap_sigma: 2.0
  sample_ratio_coco: 0.7
  sample_ratio_freihand: 0.3
  flip_prob: 0.5
  color_jitter: 0.2
  # Slice of the 49-keypoint vector to keep: indices 42-48 = face (3) + body (4).
  # See src/stage1/data/schema.py FACE_INDICES + BODY_INDICES.
  keypoint_slice: [42, 49]

model:
  num_keypoints: 7
  backbone_channels: [32, 64, 128, 256, 384]
  heatmap_channels: 256

train:
  batch_size: 128
  num_workers: 32
  epochs: 210
  lr: 1.0e-3
  lr_min: 1.0e-4
  weight_decay: 1.0e-4
  # Higher patience for a full 210-epoch ride; loss curves are flatter with K=7.
  early_stop_patience: 50
  early_stop_min_delta: 0.001
  mixed_precision: true
  # Round 2 transfer: BF16 (no GradScaler).
  # channels_last + fused_adamw disabled after the first Modal run crashed
  # with Xid 43 / device-side assert — falling back to the safer combo.
  use_bf16: true
  channels_last: false
  fused_adamw: false
  log_every: 50
  val_every: 1
  checkpoint_dir: checkpoints/stage1_v2_facebody
  seed: 42
