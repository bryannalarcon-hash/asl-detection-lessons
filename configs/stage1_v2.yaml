# Stage 1 v2 config for the full-length 49-keypoint whole-body heatmap net, extending the baseline to 210 epochs with higher early-stop patience on the same 70/30 COCO-WholeBody + FreiHAND mix.
# The longer schedule is the main change from v1, aiming to push PCK further before later face/body slicing experiments.
run_name: stage1_v2

data:
  coco_root: data/coco
  coco_ann_file: data/coco/annotations/coco_wholebody_train_v1.0.json
  coco_val_ann_file: data/coco/annotations/coco_wholebody_val_v1.0.json
  coco_train_images: train2017
  coco_val_images: train2017
  freihand_root: data/FreiHAND_pub_v2
  image_size: 256
  heatmap_size: 64
  heatmap_sigma: 2.0
  sample_ratio_coco: 0.7
  sample_ratio_freihand: 0.3
  flip_prob: 0.5
  color_jitter: 0.2

model:
  num_keypoints: 49
  backbone_channels: [32, 64, 128, 256, 384]
  heatmap_channels: 256

train:
  batch_size: 128
  num_workers: 24
  epochs: 210
  lr: 1.0e-3
  lr_min: 1.0e-4
  weight_decay: 1.0e-4
  early_stop_patience: 40
  early_stop_min_delta: 0.001
  mixed_precision: true
  log_every: 50
  val_every: 1
  checkpoint_dir: checkpoints/stage1_v2
  seed: 42
