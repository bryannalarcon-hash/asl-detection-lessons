# Stage 2 v4 config for Net 4, the 75-class sign classifier over keypoint-sequence features (max 64 frames, with visibility and lag1/lag2 deltas) read from the .npz keypoint cache.
# Defines the 1D-conv classifier (dim 192, kernel 17) with drop-path and late dropout, trained 100 epochs with label smoothing and top-1/top-3 eval.
run_name: stage2_v4_classifier_v1

data:
  # Catalog + caches all live under the data tree. The manifest is the
  # source of truth for clip→gloss→split mappings; kpt_dir holds the .npz
  # files produced by src/stage2/data/extract_keypoints.
  sign_list_json: data/signs/sign_list.json
  manifest_path: data/signs/manifest.jsonl
  kpt_dir: data/signs/kpt_cache
  max_frames: 64
  include_visibility: true
  include_lag1: true
  include_lag2: true

model:
  num_classes: 75
  dim: 192
  kernel: 17
  drop_path: 0.2
  late_dropout_p: 0.8
  late_dropout_start_step: 4000

train:
  batch_size: 128
  num_workers: 8
  epochs: 100
  lr: 1.0e-3
  lr_min: 1.0e-5
  warmup_epochs: 3
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.9995
  mixed_precision: true
  use_bf16: true
  label_smoothing: 0.1
  early_stop_patience: 20
  early_stop_min_delta: 0.001
  log_every: 50
  val_every: 1
  checkpoint_dir: checkpoints/stage2_v4_classifier_v1
  seed: 42
  s3_bucket: ""
  s3_prefix: net4/checkpoints
  s3_sync_every: 10

eval:
  val_batch_size: 128
  topk: [1, 3]
